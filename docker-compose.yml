# Shared service definitions for every environment (Local, Test,
# Production) — same images/services everywhere, per
# plans/02-environments-infrastructure.md §2. What differs between
# environments — dev vs production image targets, bind mounts, published
# ports, the Caddyfile/domain, and secrets — comes from the override file
# layered on top, never from a fork of this file:
#
#   docker compose --env-file .env.local \
#     -f docker-compose.yml -f docker-compose.local.yml up -d
#
# See docs/deployment-runbook.md for the full command per environment and
# .env.example for every variable referenced below.
services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Next.js also honors PORT, and every service shares the same env
      # file (.env.local / .env) for simplicity — without this, web would
      # silently inherit apps/api's PORT=3001 and listen on the wrong port
      # (verified: happened during local testing of this plan).
      PORT: '3000'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - web
      - api
    volumes:
      # Picks the right Caddyfile from the APP_ENV in whichever --env-file
      # was passed on the command line: .env.local locally, .env on the
      # Test/Production host (see docs/deployment-runbook.md).
      - ./docker/Caddyfile.${APP_ENV}:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  caddy_data:
