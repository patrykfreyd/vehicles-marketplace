packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  # Anonymous telemetry postinstall pulled in transitively (bullmq's tree) —
  # skipped, not needed for anything functional.
  '@scarf/scarf': false
  esbuild: true
  # Prisma's postinstall downloads its query-engine binary; @prisma/client's
  # postinstall runs `prisma generate` so a fresh `pnpm install` always
  # leaves a usable generated client (see plans/06-database-schema-migrations-baseline.md).
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  # Native acceleration for msgpackr (bullmq's job (de)serialization) —
  # built for real perf; msgpackr falls back to pure JS either way if this
  # is ever turned off.
  msgpackr-extract: true
  unrs-resolver: true
# pnpm's default supply-chain guard silently skips optionalDependencies
# (native platform bindings included) published within the age window —
# with no error, since optional-dep failures are silent by design. That bit
# us on @rolldown/binding-win32-x64-msvc (a Vitest 5 transitive dep):
# Vitest ran, but with no native binding for this platform at all. Listing
# every platform-specific binding package here as it comes up isn't
# sustainable, so the guard is off for this project instead.
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - next@16.3.5
